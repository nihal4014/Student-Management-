replicaCount: 1

image:
  repository: nihal2000/java-student-app
  tag: latest
  pullPolicy: IfNotPresent

# 🚀 बिना प्रॉपर्टीज फ़ाइल के, ये वेरिएबल्स सीधे स्प्रिंग बूट को लाइव कर देंगे
env:
  SPRING_PROFILES_ACTIVE: "prod"
  # 👇 यहाँ अपन ने लोकल क्लस्टर सर्विस का नाम 'postgres-service' और पोर्ट 5432 सेट कर दिया है भाई
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/Task1"
  SPRING_DATASOURCE_USERNAME: "postgres"
  # 👇 जो पासवर्ड अपन ने postgres.yaml में 'root' रखा है, वही यहाँ डाल रहे हैं
  SPRING_DATASOURCE_PASSWORD: "root"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "true"
  SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"
  SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false" # काफ्का बंद है, इसलिए इसे फॉल्स रखना ज़रूरी है भाई

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: api.studentmgmt.local