replicaCount: 1

image:
  repository: nihal2000/java-student-app
  tag: latest
  pullPolicy: IfNotPresent

# 🚀 यहाँ हमने स्प्रिंग बूट की एक्टिव प्रोफाइल जोड़ दी है
env:
  SPRING_PROFILES_ACTIVE: "prod"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: api.studentmgmt.local # कंपनी का लोकल डोमेन

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi