<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center">

<div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <h1 class="text-2xl font-bold text-slate-800 text-center mb-2">Forgot Password</h1>
    <p class="text-slate-500 text-center mb-6">Enter your registered Gmail to receive OTP.</p>

    <div th:if="${error}" class="mb-4 p-3 rounded-lg bg-red-100 text-red-700 text-sm" th:text="${error}"></div>
    <div th:if="${success}" class="mb-4 p-3 rounded-lg bg-green-100 text-green-700 text-sm" th:text="${success}"></div>

    <form th:action="@{/forgot-password}" method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
            <input type="email"
                   name="email"
                   required
                   placeholder="Enter your registered email"
                   class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition">
            Send OTP
        </button>
    </form>

    <div class="mt-5 text-center">
        <a th:href="@{/login}" class="text-blue-600 hover:underline text-sm">Back to Login</a>
    </div>
</div>

</body>
</html>
