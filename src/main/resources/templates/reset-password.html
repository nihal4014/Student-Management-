<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center">

<div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
  <h1 class="text-2xl font-bold text-slate-800 text-center mb-2">Reset Password</h1>
  <p class="text-slate-500 text-center mb-6">Create your new password.</p>

  <div th:if="${error}" class="mb-4 p-3 rounded-lg bg-red-100 text-red-700 text-sm" th:text="${error}"></div>
  <div th:if="${success}" class="mb-4 p-3 rounded-lg bg-green-100 text-green-700 text-sm" th:text="${success}"></div>

  <form th:action="@{/reset-password}" method="post" class="space-y-4">
    <input type="hidden" name="email" th:value="${email}">
    <input type="hidden" name="otp" th:value="${otp}">

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">New Password</label>
      <input type="password"
             name="newPassword"
             required
             placeholder="Enter new password"
             class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Confirm Password</label>
      <input type="password"
             name="confirmPassword"
             required
             placeholder="Confirm new password"
             class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <button type="submit"
            class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl transition">
      Reset Password
    </button>
  </form>
</div>

</body>
</html>
